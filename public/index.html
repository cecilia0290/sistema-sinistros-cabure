<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todos os Casos — Caburé Sinistros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;650&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/estilo.css">
  <script src="/formato.js"></script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar" class="sidebar"></div>

    <div class="main-content">
      <div class="page">
        <div class="page-header">
          <div>
            <span class="eyebrow">Operação</span>
            <h1 class="page-title">Todos os casos</h1>
            <p class="page-desc">Envie documentos de sinistro e acompanhe os casos. A leitura é 100% local (OCR + regex + Dataprev). Para muitos de uma vez, use <a href="/lote.html">Upload em lote</a>.</p>
          </div>
        </div>

        <div class="card">
          <h3>Enviar documento</h3>
          <div class="upload-row">
            <input type="file" id="arquivo" accept=".pdf,.docx,.zip,.jpg,.jpeg,.png,.json,.csv,.txt">
            <button id="btn-enviar" class="btn btn-primary">Enviar</button>
          </div>
          <div id="mensagem" class="mensagem-status"></div>
        </div>

        <div class="filtros-row">
          <label>Status
            <select id="filtro-status">
              <option value="">Todos</option>
              <option value="NOVO">NOVO</option>
              <option value="PRONTO PARA PAGAR">PRONTO PARA PAGAR</option>
              <option value="EM FRANQUIA">EM FRANQUIA</option>
              <option value="AGUARDANDO DOC">AGUARDANDO DOC</option>
              <option value="EM CARÊNCIA / ANÁLISE">EM CARÊNCIA / ANÁLISE</option>
              <option value="NEGADO">NEGADO</option>
              <option value="AGUARDANDO CONFERÊNCIA MANUAL">AGUARDANDO CONFERÊNCIA MANUAL</option>
              <option value="PAGO">PAGO</option>
              <option value="CANCELADO">CANCELADO</option>
            </select>
          </label>
          <label>Parceiro
            <select id="filtro-parceiro"><option value="">Todos</option></select>
          </label>
          <label>Adicionado — de
            <input type="date" id="filtro-criado-de">
          </label>
          <label>Adicionado — até
            <input type="date" id="filtro-criado-ate">
          </label>
          <label class="check-linha" style="align-self:flex-end; padding-bottom:6px;">
            <input type="checkbox" id="filtro-conferencia"> Só conferência manual
          </label>
        </div>

        <div class="table-toolbar">
          <div class="search-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            <input type="text" id="busca" placeholder="Buscar por nome, CPF, ID, parceiro...">
          </div>
          <div class="columns-wrap">
            <button id="btn-colunas" class="btn btn-secondary">Colunas</button>
            <div id="painel-colunas" class="columns-panel">
              <div class="columns-titulo">Mostrar colunas</div>
              <div id="lista-colunas"></div>
            </div>
          </div>
        </div>

        <div id="chips-row" class="chips-row"></div>
        <div class="resultado-contagem" id="contagem-casos">Carregando casos...</div>

        <div class="table-wrap">
          <table>
            <thead><tr id="cabecalho-tabela"></tr></thead>
            <tbody id="tabela-casos"></tbody>
          </table>
          <div class="pagination">
            <span id="paginacao-info"></span>
            <div class="pagination-btns">
              <button id="btn-pagina-anterior">‹ Anterior</button>
              <button id="btn-pagina-proxima">Próxima ›</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Definição das colunas disponíveis (Seção 3 da especificação) ---
    const COLUNAS = [
      { chave: 'id', rotulo: 'ID', tipo: 'numero', fixa: true },
      { chave: 'segurado', rotulo: 'Segurado', tipo: 'texto' },
      { chave: 'cpf_ccb', rotulo: 'CPF/CCB', tipo: 'texto', mono: true },
      { chave: 'parceiro', rotulo: 'Parceiro', tipo: 'texto' },
      { chave: 'cobertura', rotulo: 'Cobertura', tipo: 'texto' },
      { chave: 'data_evento', rotulo: 'Data evento', tipo: 'data' },
      { chave: 'valor_parcela', rotulo: 'Valor parcela', tipo: 'moeda' },
      { chave: 'teto_parcela_produto', rotulo: 'Teto (seguro)', tipo: 'moeda' },
      { chave: 'numero_parcelas_cobertas_produto', rotulo: 'Parcelas cobertas', tipo: 'numero' },
      { chave: 'carencia_dias', rotulo: 'Carência', tipo: 'numero' },
      { chave: 'franquia_data', rotulo: 'Franquia até', tipo: 'data' },
      { chave: 'cia', rotulo: 'CIA', tipo: 'texto' },
      { chave: 'data_upload', rotulo: 'Adicionado em', tipo: 'data' },
      { chave: 'valor_a_pagar_final', rotulo: 'Valor a pagar', tipo: 'moeda' },
      { chave: 'status', rotulo: 'Status', tipo: 'status', fixa: true },
      { chave: 'motivo', rotulo: 'Motivo (negado / conferência)', tipo: 'motivo' }
    ];
    const COLUNAS_PADRAO_VISIVEIS = ['id', 'segurado', 'cpf_ccb', 'parceiro', 'cobertura', 'data_evento', 'valor_a_pagar_final', 'status'];
    const CHAVE_COLUNAS_LOCALSTORAGE = 'cabure-colunas-visiveis';
    const TAMANHO_PAGINA = 25;

    let casosTodos = [];
    let colunasVisiveis = carregarColunasVisiveis();
    let ordenacao = { coluna: null, direcao: 'asc' };
    let paginaAtual = 1;

    function carregarColunasVisiveis() {
      try {
        const salvo = localStorage.getItem(CHAVE_COLUNAS_LOCALSTORAGE);
        if (salvo) return JSON.parse(salvo);
      } catch (e) { /* localStorage indisponível — usa padrão */ }
      return COLUNAS_PADRAO_VISIVEIS;
    }
    function salvarColunasVisiveis() {
      try { localStorage.setItem(CHAVE_COLUNAS_LOCALSTORAGE, JSON.stringify(colunasVisiveis)); } catch (e) {}
    }

    function classeBadge(status) {
      const mapa = {
        'PRONTO PARA PAGAR': 'badge-sucesso', 'PAGO': 'badge-sucesso',
        'EM FRANQUIA': 'badge-alerta', 'AGUARDANDO DOC': 'badge-alerta',
        'AGUARDANDO OCR MANUAL': 'badge-alerta', 'AGUARDANDO CONFERÊNCIA MANUAL': 'badge-alerta',
        'EM CARÊNCIA / ANÁLISE': 'badge-info',
        'NOVO': 'badge-neutro',
        'NEGADO': 'badge-perigo', 'CANCELADO': 'badge-perigo'
      };
      return mapa[status] || 'badge-neutro';
    }

    function motivoDoCaso(caso) {
      return caso.motivo_negacao || caso.motivo_conferencia || '';
    }

    function formatarValor(caso, coluna) {
      const valor = caso[coluna.chave];
      if (coluna.chave === 'status') {
        const m = motivoDoCaso(caso);
        return `<span class="badge ${classeBadge(valor)}">${valor}</span>${m ? '<span class="motivo-negacao">' + m + '</span>' : ''}`;
      }
      if (coluna.tipo === 'motivo') {
        const m = motivoDoCaso(caso);
        return m ? '<span class="motivo-cel">' + m + '</span>' : '<span style="color:var(--text-faint)">—</span>';
      }
      if (coluna.chave === 'segurado') return valor || caso.nome_arquivo;
      if (coluna.chave === 'cpf_ccb') return Formato.formatarCpfCcb(valor);
      if (valor === null || valor === undefined || valor === '') return '<span style="color:var(--text-faint)">—</span>';
      if (coluna.tipo === 'moeda') return Formato.brl(valor);
      if (coluna.tipo === 'data') return new Date(valor).toLocaleDateString('pt-BR');
      return valor;
    }

    // --- Montagem do cabeçalho (com ordenação por clique) ---
    function montarCabecalho() {
      const colunas = COLUNAS.filter(c => colunasVisiveis.includes(c.chave) || c.fixa);
      document.getElementById('cabecalho-tabela').innerHTML = colunas.map(c => {
        const ativo = ordenacao.coluna === c.chave;
        const seta = ativo ? (ordenacao.direcao === 'asc' ? '▲' : '▼') : '▲';
        return `<th class="th-sortable" data-coluna="${c.chave}">${c.rotulo}<span class="sort-arrow ${ativo ? 'ativo' : ''}">${seta}</span></th>`;
      }).join('');

      document.querySelectorAll('.th-sortable').forEach(th => {
        th.addEventListener('click', () => {
          const chave = th.dataset.coluna;
          if (ordenacao.coluna === chave) {
            ordenacao.direcao = ordenacao.direcao === 'asc' ? 'desc' : 'asc';
          } else {
            ordenacao = { coluna: chave, direcao: 'asc' };
          }
          paginaAtual = 1;
          renderizar();
        });
      });
    }

    // --- Painel de seleção de colunas ---
    function montarPainelColunas() {
      document.getElementById('lista-colunas').innerHTML = COLUNAS.filter(c => !c.fixa).map(c => `
        <label>
          <input type="checkbox" data-coluna="${c.chave}" ${colunasVisiveis.includes(c.chave) ? 'checked' : ''}>
          ${c.rotulo}
        </label>
      `).join('');

      document.querySelectorAll('#lista-colunas input[type="checkbox"]').forEach(input => {
        input.addEventListener('change', () => {
          const chave = input.dataset.coluna;
          if (input.checked) {
            if (!colunasVisiveis.includes(chave)) colunasVisiveis.push(chave);
          } else {
            colunasVisiveis = colunasVisiveis.filter(c => c !== chave);
          }
          salvarColunasVisiveis();
          renderizar();
        });
      });
    }

    document.getElementById('btn-colunas').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('painel-colunas').classList.toggle('aberto');
    });
    document.addEventListener('click', (e) => {
      const painel = document.getElementById('painel-colunas');
      if (!painel.contains(e.target) && e.target.id !== 'btn-colunas') painel.classList.remove('aberto');
    });

    // --- Filtros, busca, ordenação, paginação (tudo client-side, sobre os casos já carregados) ---
    function aplicarFiltrosEBusca() {
      const status = document.getElementById('filtro-status').value;
      const parceiro = document.getElementById('filtro-parceiro').value;
      const criadoDe = document.getElementById('filtro-criado-de').value;
      const criadoAte = document.getElementById('filtro-criado-ate').value;
      const soConferencia = document.getElementById('filtro-conferencia').checked;
      const busca = document.getElementById('busca').value.trim().toLowerCase();

      return casosTodos.filter(caso => {
        if (status && caso.status !== status) return false;
        if (parceiro && caso.parceiro !== parceiro) return false;
        if (soConferencia && !Number(caso.conferencia_pendente)) return false;
        if (criadoDe && (!caso.data_upload || caso.data_upload.slice(0, 10) < criadoDe)) return false;
        if (criadoAte && (!caso.data_upload || caso.data_upload.slice(0, 10) > criadoAte)) return false;
        if (busca) {
          const alvo = [caso.id, caso.segurado, caso.cpf_ccb, caso.parceiro, caso.cobertura, caso.cia, caso.nome_arquivo, motivoDoCaso(caso)]
            .filter(Boolean).join(' ').toLowerCase();
          if (!alvo.includes(busca)) return false;
        }
        return true;
      });
    }

    function ordenarLista(lista) {
      if (!ordenacao.coluna) return lista;
      const coluna = COLUNAS.find(c => c.chave === ordenacao.coluna);
      const fator = ordenacao.direcao === 'asc' ? 1 : -1;

      return [...lista].sort((a, b) => {
        let va = a[ordenacao.coluna];
        let vb = b[ordenacao.coluna];
        if (va === null || va === undefined) return 1;
        if (vb === null || vb === undefined) return -1;
        if (coluna.tipo === 'moeda' || coluna.tipo === 'numero') return (Number(va) - Number(vb)) * fator;
        if (coluna.tipo === 'data') return (new Date(va) - new Date(vb)) * fator;
        return String(va).localeCompare(String(vb), 'pt-BR') * fator;
      });
    }

    function montarChips() {
      const status = document.getElementById('filtro-status').value;
      const parceiro = document.getElementById('filtro-parceiro').value;
      const busca = document.getElementById('busca').value.trim();
      const chips = [];

      const criadoDe = document.getElementById('filtro-criado-de').value;
      const criadoAte = document.getElementById('filtro-criado-ate').value;
      const soConf = document.getElementById('filtro-conferencia').checked;

      if (status) chips.push({ rotulo: 'Status: ' + status, aoRemover: () => { document.getElementById('filtro-status').value = ''; } });
      if (parceiro) chips.push({ rotulo: 'Parceiro: ' + parceiro, aoRemover: () => { document.getElementById('filtro-parceiro').value = ''; } });
      if (soConf) chips.push({ rotulo: 'Só conferência manual', aoRemover: () => { document.getElementById('filtro-conferencia').checked = false; } });
      if (criadoDe) chips.push({ rotulo: 'Adicionado ≥ ' + criadoDe, aoRemover: () => { document.getElementById('filtro-criado-de').value = ''; } });
      if (criadoAte) chips.push({ rotulo: 'Adicionado ≤ ' + criadoAte, aoRemover: () => { document.getElementById('filtro-criado-ate').value = ''; } });
      if (busca) chips.push({ rotulo: 'Busca: "' + busca + '"', aoRemover: () => { document.getElementById('busca').value = ''; } });

      const container = document.getElementById('chips-row');
      container.innerHTML = chips.map((chip, i) => `<span class="chip">${chip.rotulo}<button data-i="${i}">×</button></span>`).join('');
      container.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => { chips[Number(btn.dataset.i)].aoRemover(); paginaAtual = 1; renderizar(); });
      });
    }

    function montarSelectParceiros() {
      const selectParceiro = document.getElementById('filtro-parceiro');
      const selecionado = selectParceiro.value;
      const unicos = [...new Set(casosTodos.map(c => c.parceiro).filter(Boolean))].sort();
      selectParceiro.innerHTML = '<option value="">Todos</option>' + unicos.map(p => `<option value="${p}">${p}</option>`).join('');
      selectParceiro.value = selecionado;
    }

    function renderizar() {
      montarCabecalho();
      montarChips();

      const filtrados = ordenarLista(aplicarFiltrosEBusca());
      document.getElementById('contagem-casos').textContent =
        filtrados.length === 1 ? '1 segurado encontrado' : `${filtrados.length} segurados encontrados`;

      const totalPaginas = Math.max(1, Math.ceil(filtrados.length / TAMANHO_PAGINA));
      if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
      const inicio = (paginaAtual - 1) * TAMANHO_PAGINA;
      const paginaDeCasos = filtrados.slice(inicio, inicio + TAMANHO_PAGINA);

      const colunas = COLUNAS.filter(c => colunasVisiveis.includes(c.chave) || c.fixa);
      document.getElementById('tabela-casos').innerHTML = paginaDeCasos.map(caso => `
        <tr class="linha-clicavel" data-id="${caso.id}">${colunas.map(c => {
          const classeExtra = c.mono ? 'col-mono' : (c.tipo === 'moeda' ? 'col-valor col-mono' : (c.tipo === 'data' ? 'col-mono' : ''));
          return `<td class="${classeExtra}">${formatarValor(caso, c)}</td>`;
        }).join('')}</tr>
      `).join('') || `<tr><td colspan="${colunas.length}" class="vazio">Nenhum caso encontrado com esses filtros.</td></tr>`;

      document.querySelectorAll('.linha-clicavel').forEach(linha => {
        linha.addEventListener('click', () => { window.location.href = '/caso.html?id=' + linha.dataset.id; });
      });

      document.getElementById('paginacao-info').textContent =
        filtrados.length === 0 ? 'Nenhum resultado' : `Página ${paginaAtual} de ${totalPaginas} — mostrando ${paginaDeCasos.length} de ${filtrados.length}`;
      document.getElementById('btn-pagina-anterior').disabled = paginaAtual <= 1;
      document.getElementById('btn-pagina-proxima').disabled = paginaAtual >= totalPaginas;
    }

    async function carregarCasos() {
      const resposta = await fetch('/casos');
      casosTodos = await resposta.json();
      montarSelectParceiros();
      montarPainelColunas();
      renderizar();
    }

    // Lê ?status=... / ?conferencia=1 / ?cia=... da URL (links do menu lateral)
    const parametrosUrl = new URLSearchParams(window.location.search);
    if (parametrosUrl.get('status')) {
      document.getElementById('filtro-status').value = parametrosUrl.get('status');
    }
    if (parametrosUrl.get('conferencia') === '1') {
      document.getElementById('filtro-conferencia').checked = true;
    }

    ['filtro-status', 'filtro-parceiro', 'filtro-criado-de', 'filtro-criado-ate'].forEach(id =>
      document.getElementById(id).addEventListener('change', () => { paginaAtual = 1; renderizar(); }));
    document.getElementById('filtro-conferencia').addEventListener('change', () => { paginaAtual = 1; renderizar(); });
    document.getElementById('busca').addEventListener('input', () => { paginaAtual = 1; renderizar(); });
    document.getElementById('btn-pagina-anterior').addEventListener('click', () => { paginaAtual--; renderizar(); });
    document.getElementById('btn-pagina-proxima').addEventListener('click', () => { paginaAtual++; renderizar(); });

    document.getElementById('btn-enviar').addEventListener('click', async () => {
      const input = document.getElementById('arquivo');
      const mensagem = document.getElementById('mensagem');
      if (!input.files[0]) {
        mensagem.textContent = 'Escolha um arquivo primeiro.';
        mensagem.className = 'mensagem-status mensagem-erro';
        return;
      }
      const formData = new FormData();
      formData.append('documento', input.files[0]);

      mensagem.textContent = 'Enviando e processando — isso pode levar de alguns segundos a poucos minutos, dependendo da quantidade de documentos...';
      mensagem.className = 'mensagem-status';
      document.getElementById('btn-enviar').disabled = true;

      const resposta = await fetch('/upload', { method: 'POST', body: formData });
      const resultado = await resposta.json();
      document.getElementById('btn-enviar').disabled = false;

      if (resposta.ok) {
        mensagem.textContent = resultado.mensagem + (resultado.id ? ' ID: ' + resultado.id : '');
        mensagem.className = 'mensagem-status mensagem-ok';
        input.value = '';
        carregarCasos();
      } else {
        mensagem.textContent = 'Erro: ' + resultado.erro;
        mensagem.className = 'mensagem-status mensagem-erro';
      }
    });

    carregarCasos();
  </script>
  <script src="/layout.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalhe do Caso — Caburé Sinistros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;650&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/estilo.css">
  <script src="/formato.js"></script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar" class="sidebar"></div>

    <div class="main-content">
      <div class="page" id="conteudo-pagina">
        <a href="/index.html" class="breadcrumb">← Voltar para casos</a>
        <div class="vazio" id="carregando">Carregando caso...</div>
      </div>
    </div>
  </div>

  <script>
    function classeBadge(status) {
      const mapa = {
        'PRONTO PARA PAGAR': 'badge-sucesso', 'PAGO': 'badge-sucesso',
        'EM FRANQUIA': 'badge-alerta', 'AGUARDANDO DOC': 'badge-alerta', 'AGUARDANDO OCR MANUAL': 'badge-alerta',
        'EM CARÊNCIA / ANÁLISE': 'badge-info',
        'NOVO': 'badge-neutro',
        'NEGADO': 'badge-perigo', 'CANCELADO': 'badge-perigo'
      };
      return mapa[status] || 'badge-neutro';
    }

    function fmtData(v) { return v ? new Date(v).toLocaleDateString('pt-BR') : '—'; }
    function fmtMoeda(v) { return v !== null && v !== undefined ? 'R$ ' + Number(v).toFixed(2) : '—'; }

    function iconePorExtensao(nome) {
      const ext = (nome.split('.').pop() || '').toLowerCase();
      if (ext === 'pdf') return '📄';
      if (ext === 'docx' || ext === 'doc') return '📝';
      if (['jpg', 'jpeg', 'png'].includes(ext)) return '🖼️';
      return '📎';
    }

    function itemAnalise(status, titulo, detalhe) {
      const icone = status === 'ok' ? '✓' : status === 'nao' ? '✕' : '!';
      return `
        <div class="analise-item">
          <div class="analise-icone ${status}">${icone}</div>
          <div class="analise-texto">
            <div class="analise-titulo">${titulo}</div>
            ${detalhe ? '<div class="analise-detalhe">' + detalhe + '</div>' : ''}
          </div>
        </div>`;
    }

    async function carregarCaso() {
      const id = new URLSearchParams(window.location.search).get('id');
      if (!id || !/^\d+$/.test(id)) {
        document.getElementById('carregando').textContent = 'Nenhum caso válido informado na URL.';
        return;
      }

      let respCaso, respDocs, respHist;
      try {
        [respCaso, respDocs, respHist] = await Promise.all([
          fetch('/api/casos/' + id),
          fetch('/api/documentos/' + id),
          fetch('/api/historico/' + id)
        ]);
      } catch (e) {
        document.getElementById('carregando').innerHTML = 'Falha de conexão ao carregar o caso. <a href="#" onclick="location.reload();return false;">Tentar de novo</a>';
        return;
      }

      if (respCaso.status === 401) { window.location.href = '/login.html'; return; }
      if (!respCaso.ok) {
        document.getElementById('carregando').textContent = 'Caso não encontrado.';
        return;
      }

      const caso = await respCaso.json();
      // Documentos/histórico não podem derrubar a página: se falharem, seguem vazios.
      let documentos = respDocs && respDocs.ok ? await respDocs.json().catch(() => []) : [];
      let historico = respHist && respHist.ok ? await respHist.json().catch(() => []) : [];
      if (!Array.isArray(documentos)) documentos = [];
      if (!Array.isArray(historico)) historico = [];
      if (!caso.analise) caso.analise = { elegibilidade: {}, carencia: {}, franquiaData: null };

      document.title = 'Caso #' + caso.id + ' — Caburé Sinistros';

      // --- Análise: elegibilidade ---
      let elegBloco;
      if (caso.analise.elegibilidade.elegivel === true) {
        elegBloco = itemAnalise('ok', 'Elegibilidade', 'Motivo de desligamento dentro dos códigos cobertos.');
      } else if (caso.analise.elegibilidade.elegivel === false) {
        elegBloco = itemAnalise('nao', 'Elegibilidade', caso.analise.elegibilidade.motivo);
      } else {
        elegBloco = itemAnalise('pendente', 'Elegibilidade', caso.analise.elegibilidade.motivo || 'Aguardando código do motivo de desligamento.');
      }

      // --- Análise: carência ---
      let carBloco;
      if (caso.analise.carencia.cumprida === true) {
        carBloco = itemAnalise('ok', 'Carência', `${caso.analise.carencia.carenciaDias} dias entre contratação e evento — mínimo de 31 dias cumprido.`);
      } else if (caso.analise.carencia.cumprida === false) {
        carBloco = itemAnalise('nao', 'Carência', `Apenas ${caso.analise.carencia.carenciaDias} dias — abaixo do mínimo de 31 dias.`);
      } else {
        carBloco = itemAnalise('pendente', 'Carência', 'Aguardando data de contratação e/ou data do evento.');
      }

      // --- Análise: franquia ---
      let franBloco;
      const franquiaData = caso.analise.franquiaData;
      if (franquiaData) {
        const hoje = new Date();
        const dataFranquia = new Date(franquiaData);
        if (hoje >= dataFranquia) {
          franBloco = itemAnalise('ok', 'Franquia', `Período encerrado em ${fmtData(franquiaData)}.`);
        } else {
          franBloco = itemAnalise('pendente', 'Franquia', `Ainda dentro do período — libera em ${fmtData(franquiaData)}.`);
        }
      } else {
        franBloco = itemAnalise('pendente', 'Franquia', 'Aguardando data do evento para calcular.');
      }

      // --- Parcelas: conciliadas com pagamentos_confirmados ---
      // pagamento_parcial não é coluna do banco: deriva da classificação.
      caso.pagamento_parcial = /próxima parcela/.test(caso.classificacao_pagamento || '');
      const numParcelas = caso.numero_parcelas_cobertas_produto || caso.parcelas_cobertas_produto || 0;
      const pagas = Number(caso.parcelas_pagas) || 0;
      const restantes = caso.parcelas_restantes != null ? Number(caso.parcelas_restantes) : (numParcelas ? Math.max(0, numParcelas - pagas) : null);
      let linhasParcelas = '';
      for (let i = 1; i <= numParcelas; i++) {
        const paga = i <= pagas;
        linhasParcelas += `<tr><td>${i}ª parcela</td><td class="col-mono">${fmtMoeda(caso.valor_a_pagar)}</td>` +
          `<td><span class="badge ${paga ? 'badge-sucesso' : 'badge-neutro'}">${paga ? 'Paga (comprovante)' : 'Pendente'}</span></td></tr>`;
      }

      document.getElementById('conteudo-pagina').innerHTML = `
        <a href="/index.html" class="breadcrumb">← Voltar para casos</a>

        <div class="caso-header">
          <div>
            <div class="caso-id">CASO #${String(caso.id).padStart(6, '0')}</div>
            <h1 class="caso-nome">${caso.segurado || caso.nome_arquivo}</h1>
            <div class="caso-sub">${caso.parceiro || 'Parceiro não identificado'}${caso.cia ? ' · CIA ' + caso.cia : ''}</div>
          </div>
          <span class="badge ${classeBadge(caso.status)}" style="font-size:13px; padding:6px 14px;">${caso.status}</span>
        </div>

        ${Number(caso.conferencia_pendente) ? `<div class="aviso-caixa" style="border-color:var(--warning-dot);">
          <strong>Aguardando conferência manual.</strong> ${caso.motivo_conferencia || 'A leitura automática não concluiu.'}
          <a href="/conferencia.html" style="margin-left:6px;">Abrir conferência →</a></div>` : ''}

        <div class="secao">
          <h3>Resumo</h3>
          <div class="resumo-grid">
            <div class="resumo-item"><div class="rotulo">Valor da parcela</div><div class="valor">${fmtMoeda(caso.valor_parcela)}</div></div>
            <div class="resumo-item"><div class="rotulo">Teto do seguro</div><div class="valor">${fmtMoeda(caso.teto_parcela_produto)}</div></div>
            <div class="resumo-item"><div class="rotulo">Parcelas cobertas</div><div class="valor">${caso.numero_parcelas_cobertas_produto ?? '—'}</div></div>
            <div class="resumo-item"><div class="rotulo">Data do evento</div><div class="valor">${fmtData(caso.data_evento)}</div></div>
            <div class="resumo-item"><div class="rotulo">Valor por parcela</div><div class="valor">${fmtMoeda(caso.valor_a_pagar)}</div></div>
            <div class="resumo-item"><div class="rotulo">${caso.pagamento_parcial ? 'Próxima parcela a pagar' : 'Total a pagar'}</div><div class="valor destaque">${fmtMoeda(caso.valor_a_pagar_final ?? caso.valor_total_a_pagar ?? caso.valor_a_pagar)}</div></div>
            <div class="resumo-item"><div class="rotulo">Parcelas pagas / restantes</div><div class="valor">${(caso.parcelas_pagas ?? 0)} / ${caso.parcelas_restantes ?? '—'}</div></div>
            <div class="resumo-item"><div class="rotulo">Classificação de pagamento</div><div class="valor" style="font-family:'Inter',sans-serif; font-weight:500; font-size:13px;">${caso.classificacao_pagamento || '—'}${caso.observacao_pagamento ? '<div style="font-weight:400; font-size:12px; color:var(--text-faint); margin-top:2px;">' + caso.observacao_pagamento + '</div>' : ''}</div></div>
            <div class="resumo-item"><div class="rotulo">Marcado “a pagar” (planilha)</div><div class="valor"><span class="badge ${Number(caso.casos_a_pagar) ? 'badge-sucesso' : 'badge-neutro'}">${Number(caso.casos_a_pagar) ? 'SIM' : 'NÃO'}</span></div></div>
          </div>
          ${caso.status_planilha ? '<div class="aviso-caixa">Etiqueta de STATUS na planilha: <strong>' + caso.status_planilha + '</strong> — usada só como referência; quem decide o pagamento é a coluna CASOS A PAGAR.</div>' : ''}
        </div>

        <div class="secao">
          <h3>Informações do segurado</h3>
          <div class="resumo-grid">
            <div class="resumo-item"><div class="rotulo">CPF / CCB</div><div class="valor">${window.Formato ? Formato.formatarCpfCcb(caso.cpf_ccb) : (caso.cpf_ccb || '—')}</div></div>
            <div class="resumo-item"><div class="rotulo">Cobertura</div><div class="valor" style="font-family:'Inter',sans-serif; font-weight:500; font-size:13.5px;">${caso.cobertura || '—'}</div></div>
            <div class="resumo-item"><div class="rotulo">Fundo</div><div class="valor" style="font-family:'Inter',sans-serif; font-weight:500; font-size:13.5px;">${caso.fundo || '—'}</div></div>
            <div class="resumo-item"><div class="rotulo">Data de contratação</div><div class="valor">${fmtData(caso.data_contratacao)}</div></div>
            <div class="resumo-item"><div class="rotulo">Data de admissão</div><div class="valor">${fmtData(caso.data_admissao)}</div></div>
          </div>
        </div>

        <div class="secao">
          <h3>Documentos (${documentos.length})</h3>
          ${documentos.length > 0 ? `
            <div class="doc-grid">
              ${documentos.map(doc => `
                <div class="doc-card">
                  <div class="doc-icon">${iconePorExtensao(doc.nome_arquivo)}</div>
                  <div class="doc-nome">${doc.nome_arquivo}</div>
                  <div class="doc-meta">${fmtData(doc.data_upload)}</div>
                  <div style="margin-top:6px;"><span class="badge ${doc.status_processamento === 'PROCESSADO' ? 'badge-sucesso' : 'badge-alerta'}">${doc.status_processamento}</span></div>
                </div>
              `).join('')}
            </div>
            <div class="aviso-caixa">Pré-visualização e download dos arquivos originais ainda não estão disponíveis nesta versão — hoje o sistema guarda o texto extraído de cada documento para consulta e auditoria.</div>
          ` : '<div class="vazio">Nenhum documento vinculado a este caso.</div>'}
        </div>

        <div class="secao">
          <h3>Análise do motor de regras</h3>
          <div class="analise-lista">
            ${elegBloco}
            ${carBloco}
            ${franBloco}
          </div>
          ${caso.motivo_negacao ? '<div class="aviso-caixa"><strong>Motivo do status atual:</strong> ' + caso.motivo_negacao + '</div>' : ''}
        </div>

        ${numParcelas > 0 ? `
          <div class="secao">
            <h3>Parcelas</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Parcela</th><th>Valor</th><th>Situação</th></tr></thead>
                <tbody>${linhasParcelas}</tbody>
              </table>
            </div>
            <div class="aviso-caixa">${pagas > 0
              ? `${pagas} parcela(s) confirmada(s) em <code>pagamentos_confirmados</code> (1 por lote de pagamento). ${restantes > 0 ? 'Falta(m) ' + restantes + ' — por isso o caso segue A PAGAR, no valor de 1 parcela.' : 'Todas as parcelas cobertas foram pagas — caso encerrado.'}`
              : 'Nenhuma parcela conciliada com <code>pagamentos_confirmados</code> ainda.'}</div>
          </div>
        ` : ''}

        <div class="secao">
          <h3>Histórico (${historico.length})</h3>
          ${historico.length > 0 ? `
            <div class="timeline">
              ${historico.map(item => `
                <div class="timeline-item">
                  <div class="timeline-dot"></div>
                  <div class="timeline-texto">
                    <div class="timeline-titulo">${item.campo} alterado</div>
                    <div class="timeline-detalhe">${item.valor_anterior || '(vazio)'} → ${item.valor_novo || '(vazio)'}</div>
                    <div class="timeline-meta">${item.usuario} · ${new Date(item.data_hora).toLocaleString('pt-BR')}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : '<div class="vazio">Nenhuma alteração registrada ainda.</div>'}
        </div>
      `;
    }

    carregarCaso().catch(err => {
      console.error(err);
      const alvo = document.getElementById('conteudo-pagina') || document.body;
      alvo.innerHTML = '<a href="/index.html" class="breadcrumb">← Voltar para casos</a>' +
        '<div class="vazio">Não foi possível montar a página do caso (' + (err && err.message ? err.message : 'erro') +
        '). <a href="#" onclick="location.reload();return false;">Recarregar</a></div>';
    });
  </script>
  <script src="/layout.js"></script>
</body>
</html>

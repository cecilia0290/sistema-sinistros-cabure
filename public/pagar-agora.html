<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pagar Agora — Sistema de Sinistros</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #1a1a2e; }
    nav { margin-bottom: 25px; padding: 12px; background: #f2f2f2; border-radius: 8px; }
    nav a { margin-right: 18px; color: #1a1a2e; font-weight: bold; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 13px; }
    th { background: #1a1a2e; color: white; }
    .vazio { padding: 20px; text-align: center; color: #777; }
  </style>
</head>
<body>
  <nav>
    <a href="/index.html">Todos os Casos</a>
    <a href="/dashboard.html">Dashboard</a>
    <a href="/pagar-agora.html">Pagar Agora</a>
    <a href="/exportar">Exportar Excel</a>
  </nav>

  <h1>Pagar Agora</h1>
  <p>Casos elegíveis, com carência e franquia já cumpridas — prontos para pagamento imediato (Seção 4 da especificação).</p>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Segurado</th>
        <th>CPF/CCB</th>
        <th>Parceiro</th>
        <th>CIA</th>
        <th>Valor a pagar</th>
      </tr>
    </thead>
    <tbody id="tabela-pagar"></tbody>
  </table>
  <div id="mensagem-vazia" class="vazio" style="display:none;">Nenhum caso pronto para pagamento no momento.</div>

  <script>
    async function carregarPagarAgora() {
      const resposta = await fetch('/casos?status=' + encodeURIComponent('PRONTO PARA PAGAR'));
      const casos = await resposta.json();

      document.getElementById('tabela-pagar').innerHTML = casos.map(caso => `
        <tr>
          <td>${caso.id}</td>
          <td>${caso.segurado || caso.nome_arquivo}</td>
          <td>${caso.cpf_ccb || '-'}</td>
          <td>${caso.parceiro || '-'}</td>
          <td>${caso.cia || '-'}</td>
          <td>${caso.valor_a_pagar !== null ? 'R$ ' + Number(caso.valor_a_pagar).toFixed(2) : '-'}</td>
        </tr>
      `).join('');

      document.getElementById('mensagem-vazia').style.display = casos.length === 0 ? 'block' : 'none';
    }

    carregarPagarAgora();
         document.getElementById('link-sair').addEventListener('click', async (evento) => {
         evento.preventDefault();
         await fetch('/logout', { method: 'POST' });
         window.location.href = '/login.html';
       });
  </script>
</body>
</html>
